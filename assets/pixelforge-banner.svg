  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#14233a"/><stop offset="1" stop-color="#0c1729"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-opacity=".08"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
