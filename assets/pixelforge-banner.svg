<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">PixelForge — AI Game Engineer</title>
<desc id="desc">A dark futuristic banner with a colorful 2D pixel platform game scene and the PixelForge open-source AI game development agent identity.</desc>
