[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelforge-ai"
version = "0.2.0"
description = "Open-source AI agent specialized for autonomous 2D game development. Works with cloud APIs and local models."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Khayom Abdurahmonov", email = "142344499+Khayom1@users.noreply.github.com" }]
dependencies = []
keywords = ["ai-agent", "2d-games", "game-development", "phaser", "local-llm", "openai-compatible"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
pixelforge = "pixelforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
