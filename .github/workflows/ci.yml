name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest --cov=pixelforge --cov-report=term-missing
      - if: matrix.python-version == '3.12'
        run: ruff check src tests

  game-template:
    name: Generate and build a real Phaser game
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PixelForge
        run: python -m pip install .
      - name: Generate a game project
        run: pixelforge init --engine phaser --name "CI Smoke Test" --output ./ci-game
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install generated game dependencies
        run: npm install --prefix ./ci-game
      - name: Build generated game
        run: npm run build --prefix ./ci-game
