name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest --cov=pixelforge --cov-report=term-missing
      - if: matrix.python-version == '3.12'
        run: ruff check src tests

  game-template:
    name: Generate and build a real Phaser game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PixelForge
        run: python -m pip install .
      - name: Generate a game project
        run: pixelforge init --engine phaser --name "CI Smoke Test" --output ./ci-game
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install generated game dependencies
        run: npm install --prefix ./ci-game
      - name: Build generated game
        run: npm run build --prefix ./ci-game
